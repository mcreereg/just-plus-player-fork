name: Android Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Signing comes from app/keystore/release.jks in the tree (see app/build.gradle).
      # Injected secrets were a second key and made sideload updates fail.
      - run: ./gradlew assembleLatestUniversalRelease
          -PSENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/latestUniversal/release/*.apk
          prerelease: true
          draft: true
